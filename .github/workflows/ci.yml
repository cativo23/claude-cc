name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Defense-in-depth: explicit read-only token. CI doesn't write to the repo,
# release.yml is the only workflow that needs contents:write / id-token:write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Coverage thresholds enforced via vitest.config.ts. A drop below
      # the configured floors (lines 87, statements 85, branches 75,
      # functions 80) fails this step.
      - run: npm run test:coverage
      - run: npm run lint
      - run: npm run build
      # Bundle size guard: measures only the .js files that actually ship and
      # execute (source maps + .d.ts are excluded from the npm package via the
      # files allowlist in package.json, so they don't count). Currently ~285 KB
      # of JS after the custom commands widget. Ceiling is 400 KB. Raise it
      # alongside the corresponding PR — and in release.yml too — if a feature
      # genuinely needs the headroom.
      - name: Bundle size guard
        env:
          CEILING: '409600'
        run: |
          SIZE=$(find dist -name '*.js' -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          echo "dist/ JS size: $SIZE bytes (ceiling: $CEILING)"
          if [ "$SIZE" -gt "$CEILING" ]; then
            echo "::error::dist/ JS exceeded ceiling — raise it in ci.yml + release.yml if intentional"
            exit 1
          fi
      # Theme contrast guard. Reads compiled THEMES from dist/, computes
      # WCAG relative-luminance contrast for every powerline cell against
      # its declared fg, fails the build if any cell drops below 4.5:1
      # (AA for normal text). Catches contributor PRs that submit a brand
      # palette where white-on-bg becomes unreadable.
      - name: Theme contrast guard (WCAG AA)
        run: node scripts/validate-themes.mjs
